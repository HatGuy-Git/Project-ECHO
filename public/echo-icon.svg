<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="mainframeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00ffcc;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#00cc99;stop-opacity:1" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background circle -->
  <circle cx="50" cy="50" r="45" fill="#0a0a0f" stroke="url(#mainframeGrad)" stroke-width="3"/>
  
  <!-- E letter stylized as sound waves / echo -->
  <g filter="url(#glow)">
    <!-- Main E shape -->
    <path d="M 30 25 L 30 75 L 60 75" fill="none" stroke="url(#mainframeGrad)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M 30 50 L 55 50" fill="none" stroke="url(#mainframeGrad)" stroke-width="5" stroke-linecap="round"/>
    <path d="M 30 25 L 60 25" fill="none" stroke="url(#mainframeGrad)" stroke-width="5" stroke-linecap="round"/>
    
    <!-- Echo waves -->
    <path d="M 65 35 Q 75 50 65 65" fill="none" stroke="#00ffcc" stroke-width="2" stroke-linecap="round" opacity="0.8"/>
    <path d="M 72 30 Q 85 50 72 70" fill="none" stroke="#00ffcc" stroke-width="2" stroke-linecap="round" opacity="0.5"/>
  </g>
</svg>

